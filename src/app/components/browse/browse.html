<div class="flex flex-col gap-4">

    <div class="flex flex-col">
        <div class="text-3xl"> {{browse() ? 'Browse' : 'Favourite'}} Cocktails</div>
        <div class="text-gray-500">Explore over 100 recipes for any occasion.</div>
    </div>

    <input class="w-full" type="text" pInputText (input)="onSearch($event)" placeholder="Search recipes, ingredients..." />

    <div class="grid gap-4 grid-cols-[repeat(auto-fill,minmax(150px,1fr))]">
        @for (item of cocktails(); track $index) {
            <app-cocktail [cocktail]="item" (click)="goToDetails(item.id)" [saved]="saved().has(item.id)" (onSave)="save(item.id)"></app-cocktail>
        }
    </div>

</div>
