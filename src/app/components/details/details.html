<div class="flex flex-col gap-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-4">
            <div class="text-6xl">{{cocktail.title}}</div>
            <div class="text-lg text-gray-600">
                {{cocktail.description}}
            </div>
            <div class="flex gap-2 items-center">
                <p-tag [value]="cocktail.base + ' base' | titlecase" />
                <div class="bg-gray-500 h-1.5 w-1.5 rounded-full"></div>
                <div class="text-gray-500">{{cocktail.glass | titlecase}}</div>
            </div>
            <div class="flex gap-2">
                <!-- <p-button [rounded]="true" label="Calculate Ingredients"></p-button> -->
                <p-button [rounded]="true" [outlined]="true">
                    <ng-template pTemplate="icon">
                        <span (click)="toggleSaved()" class="material-symbols-rounded" [class]="saved.has(cocktail.id) ? 'filled':''">favorite</span>
                    </ng-template>
                </p-button>
                <p-button [rounded]="true" [outlined]="true">
                    <ng-template pTemplate="icon">
                        <span (click)="sharePage()" class="material-symbols-rounded">share</span>
                    </ng-template>
                </p-button>
            </div>
        </div>
        <div [style.backgroundImage]="'url(/imgs/' + cocktail.img + ')'" class="bg-cover bg-center rounded-2xl aspect-3/4 w-full"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-4">
            <div class="bg-primary-500/10 rounded-2xl p-4 flex flex-col gap-2">
                <div class="text-xl">Ingredients</div>
                @for (item of cocktail.ingredients; track $index) {
                <div>{{item}}</div>
                }
            </div>
        </div>
        <div class="md:col-span-8">
            <div class="bg-white rounded-2xl p-4 flex flex-col gap-2">
                <div class="text-2xl">Instructions</div>
                @for (item of cocktail.steps; track $index) {
                <p-fieldset [legend]="'Step ' + ($index+1)">
                    <p class="m-0">
                        {{item}}
                    </p>
                </p-fieldset>
                }
            </div>
        </div>
    </div>
</div>

<p-popover #op>
    <div class="flex flex-col gap-4 w-100">
        <div>
            <span class="font-medium text-surface-900 dark:text-surface-0 block mb-2">Share this document</span>
            <!-- <p-inputgroup>
                <input pInputText value="https://primeng.org/12323ff26t2g243g423g234gg52hy25XADXAG3" readonly class="w-[25rem]" />
                <p-inputgroup-addon>
                    <i class="pi pi-copy"></i>
                </p-inputgroup-addon>
            </p-inputgroup> -->
        </div>
    </div>
</p-popover>
